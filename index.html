  'Jumeok':'주먹','Jireugi':'지르기','Chagi':'차기','Ap':'앞',
  'An':'안','Bakkat':'바깥','Arae':'아래','Momtong':'몸통',
  'Eolgeul':'얼굴','Charyeot':'차렷','Kyeongne':'경례',
  'Joonbi':'준비','Keuman':'그만','Do bok':'도복','Do jang':'도장',
  'Son':'손','Sonnal':'손날','Bal':'발','Baldeung':'발등',
  'Chigi':'치기','Dollyo':'돌려','Poom':'품','Poomse':'품새',
  'Hanna':'하나','Dul':'둘','Set':'셋','Net':'넷',
  'Taseot':'다섯','Yeoseot':'여섯','Ilgeop':'일곱',
  'Yeodeol':'여덟','Ahop':'아홉','Yeol':'열',
  'Palmok':'팔목','Balnal':'발날','Apchook':'앞축',
  'Mok':'목','Yeop':'옆','Il':'일','Yi':'이','Sam':'삼',
  'Sah':'사','Oh':'오','Yook':'육','Chil':'칠','Pal':'팔',
  'Ku':'구','Sip':'십','Batangson':'바탕손',
  'Balbadak':'발바닥','Shijak':'시작','Kalyeo':'갈려',
  'Gyesok':'계속','Mileo':'밀어','Palkoop':'팔굽',
  'Dari':'다리','Mooreup':'무릎','Pyojeok':'표적',
  'Me jumeok':'메주먹','Mit palmok':'밑팔목'
};
let speechRate=.85;
try{const r=Number(localStorage.getItem('arirang-tts-rate-v1'));if([.7,.85,1].includes(r))speechRate=r;}catch{}
function availableSpeechVoices(){
  if(!TTS_AVAILABLE)return [];
  try{return Array.from(window.speechSynthesis.getVoices()||[]);}catch{return [];}
}
function voicesFor(prefix){
  return availableSpeechVoices().find(v=>String(v.lang||'').toLowerCase().startsWith(prefix.toLowerCase()))||null;
}
let activeSpeechRequest=0;
let speechStartTimer=null;
function speechStatus(message){
  const el=document.getElementById('ttsStatus');
  if(!el)return;
  el.textContent=message;
  el.classList.toggle('show',Boolean(message));
}
function clearSpeechTimer(){
  if(speechStartTimer!==null){clearTimeout(speechStartTimer);speechStartTimer=null;}
}
function cancelSpeech(){
  activeSpeechRequest++;
  clearSpeechTimer();
  if(TTS_AVAILABLE){
    try{window.speechSynthesis.cancel();}catch{}
  }
  speechStatus('');
}
function playableTheory(x){return x&&x.type==='theory'&&Boolean(String(x.pron||'').trim()||HANGUL_TERMS[x.name]);}
function speakItem(item,kind='ko'){
  if(!item||!TTS_AVAILABLE){
    speechStatus('Denne browser understøtter ikke oplæsning. Prøv en anden browser eller enhed.');
    return;
  }
  const voices=availableSpeechVoices();
  if(!voices.length){
    speechStatus('Ingen oplæsningsstemmer fundet. Firefox kan have brug for lidt tid til at indlæse stemmerne. Prøv igen, eller kontrollér at enheden har TTS-stemmer installeret.');
    return;
  }
  const korean=kind==='ko';
  const known=HANGUL_TERMS[item.name];
  const nativeVoice=korean&&known?(voicesFor('ko')):null;
  const useNative=Boolean(korean&&known&&nativeVoice);
  const fallbackVoice=voicesFor('da');
  const chosenVoice=useNative?nativeVoice:fallbackVoice;
  if(!chosenVoice){
    speechStatus(korean?'Der mangler en koreansk eller dansk stemme i browseren. Installér en af dem på enheden for at høre ordene.':'Der mangler en dansk TTS-stemme. Installér en dansk stemme i systemet eller prøv en anden browser.');
    return;
  }
  const toRead=korean?(useNative?known:(item.pron||item.name)):item.desc;
  if(!toRead){
    speechStatus('Der er ingen tekst at læse op.');
    return;
  }
  const synth=window.speechSynthesis;
  const request=++activeSpeechRequest;
  clearSpeechTimer();
  try{
    if(synth.speaking||synth.pending)synth.cancel();
    if(synth.paused)synth.resume();
    const utterance=new SpeechSynthesisUtterance(String(toRead));
    utterance.lang=chosenVoice.lang||(useNative?'ko-KR':'da-DK');
    utterance.voice=chosenVoice;
    utterance.rate=speechRate;
    utterance.pitch=1;
    utterance.volume=1;
    let started=false;
    const description=!korean?'dansk betydning':useNative?'koreansk udtale':'vejledende dansk lydskrift (ikke koreansk originaludtale)';
    utterance.onstart=()=>{
      if(request!==activeSpeechRequest)return;
      started=true;
      clearSpeechTimer();
      speechStatus('Afspiller '+description+'.');
      if(ui.quiz?.mode==='listening'&&ui.quiz.questions?.[ui.quiz.index]?.id===item.id){ui.quiz.heard=true;document.querySelectorAll('[data-quiz-choice]').forEach(b=>b.disabled=false);}
    };
    utterance.onend=()=>{
      if(request!==activeSpeechRequest)return;
      clearSpeechTimer();
      speechStatus('');
    };
    utterance.onerror=(event)=>{
      if(request!==activeSpeechRequest)return;
      clearSpeechTimer();
      const error=event?.error||'ukendt fejl';
      const explanation={
        'not-allowed':'Firefox har blokeret oplæsningen. Tryk på afspilningsknappen igen.',
        'voice-unavailable':'Den valgte stemme kan ikke bruges. Tjek installerede sprogstemmer.',
        'language-unavailable':'En passende sprogstemme er ikke installeret.',
        'synthesis-unavailable':'Tale-motoren er ikke tilgængelig på denne enhed.',
        'synthesis-failed':'Tale-motoren kunne ikke afspille ordet.',
        'audio-hardware':'Der er et problem med enhedens lydudgang.',
        'audio-busy':'Lydudgangen er optaget. Prøv igen.',
        'network':'Tale-motoren kunne ikke hente den nødvendige stemme.',
        'interrupted':'Oplæsningen blev afbrudt. Prøv igen.'
      }[error]||'Oplæsningen fejlede ('+error+'). Kontrollér browserens stemmer og prøv igen.';
      speechStatus(explanation);
    };
    speechStatus('Starter oplæsning af '+description+' …');
    synth.speak(utterance);
    speechStartTimer=setTimeout(()=>{
      if(request!==activeSpeechRequest||started)return;
      try{synth.cancel();}catch{}
      speechStatus('Firefox begyndte ikke at afspille lyden. Kontrollér installerede TTS-stemmer, og prøv igen. Du kan også teste med dansk tale nedenfor.');
    },5500);
  }catch(error){
    if(request!==activeSpeechRequest)return;
    clearSpeechTimer();
    speechStatus('Oplæsningen kunne ikke startes i denne browser. Prøv en anden stemme eller browser.');
  }
}
if(TTS_AVAILABLE){
  // In Firefox the first getVoices() call can start asynchronous voice loading.
  availableSpeechVoices();
  try{
    window.speechSynthesis.addEventListener('voiceschanged',()=>{
      if(availableSpeechVoices().length&&document.getElementById('ttsStatus')?.textContent?.includes('Ingen oplæsningsstemmer')){
        speechStatus('Stemmerne er nu klar. Tryk på Hør ordet igen.');
      }
    });
  }catch{}
}

    <button class="btn small secondary" data-speak-item="${item.id}" data-speak-type="ko" ${!TTS_AVAILABLE?'disabled':''} aria-label="Hør udtalen af ${cleanText(item.name)}">🔊 Hør ordet</button>
    ${meaning?`<button class="btn small ghost" data-speak-item="${item.id}" data-speak-type="da" ${!TTS_AVAILABLE?'disabled':''}>🔊 Hør dansk</button>`:''}
  </div>`;
}
function ttsSettings(){return `<div class="tts-config"><label for="ttsRate">Oplæsningshastighed:</label><select id="ttsRate" data-tts-rate>
  ${[[.7,'Langsom'],[.85,'Normal'],[1,'Hurtig']].map(([value,label])=>`<option value="${value}" ${value===speechRate?'selected':''}>${label}</option>`).join('')}
  </select><button class="btn small secondary" data-test-tts ${!TTS_AVAILABLE?'disabled':''}>🔊 Test dansk lyd</button><button class="btn small ghost" data-stop-tts ${!TTS_AVAILABLE?'disabled':''}>■ Stop lyd</button><span class="small muted" aria-live="polite">Tilgængelige stemmer: ${availableSpeechVoices().length}. ${TTS_AVAILABLE?'Hvis lydtesten fejler, mangler Firefox muligvis en systemstemme.':'Denne browser understøtter ikke oplæsning.'}</span></div>`;}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newProfile(name='Min træning'){return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,kup:6,mode:'grade',includeGrade:true,extraIds:[],mastery:{},known:{},checks:{},videos:{}};}
function normalizeProfile(p){return {...newProfile(),...p,extraIds:Array.isArray(p.extraIds)?p.extraIds.filter(id=>IDX[id]):[],mastery:p.mastery||{},known:p.known||{},checks:p.checks||{},videos:p.videos||{}};}
function migrateLegacy(profile){
  let old={};try{old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'{}')||{};}catch{}
  const ids=[...SYLLABUS[6].items.filter(x=>x.type==='stances').map(x=>x.id),...SYLLABUS[6].items.filter(x=>x.type==='hands').map(x=>x.id),...SYLLABUS[6].items.filter(x=>x.type==='kicks').map(x=>x.id)];
  ids.forEach((id,i)=>{if(old.ratings?.['t'+i]!==undefined)profile.mastery[id]=old.ratings['t'+i];if(old.customVideos?.['t'+i])profile.videos[id]=old.customVideos['t'+i];});
  const formIds=SYLLABUS[6].items.filter(x=>x.type==='forms').map(x=>x.id);
  formIds.forEach((id,i)=>{if(old.ratings?.['f'+i]!==undefined)profile.mastery[id]=old.ratings['f'+i];if(old.customVideos?.['f'+i])profile.videos[id]=old.customVideos['f'+i];});
  const b6=SYLLABUS[6].items.filter(x=>x.type==='theory');
  b6.forEach((x,i)=>{if(old.known?.['w'+i]!==undefined)profile.known[x.id]=!!old.known['w'+i];});
  ['Shijak','Kalyeo','Gyesok','Mileo','Batangson','Balbadak'].forEach((name,i)=>{const x=SYLLABUS[7].items.find(y=>y.type==='theory'&&y.name===name);if(x&&old.known?.['w'+(i+6)]!==undefined)profile.known[x.id]=!!old.known['w'+(i+6)];});
  const practiceIDs={one:'k6-oneStep-0',three:'k6-threeStep-0',def:'k6-selfDefence-0',spar:'k6-sparring-0'};
  for(const [prefix,newId] of Object.entries(practiceIDs)){const item=IDX[newId];for(let i=0;i<(item?.count||0);i++)if(old.checks?.[prefix+i]!==undefined)profile.checks[newId+':'+i]=!!old.checks[prefix+i];}
}
function loadDB(){let v=null;try{v=JSON.parse(localStorage.getItem(PORTAL_KEY)||'null');}catch{}if(v&&Array.isArray(v.profiles)&&v.profiles.length){v.profiles=v.profiles.map(normalizeProfile);if(!v.profiles.some(p=>p.id===v.active))v.active=v.profiles[0].id;return v;}const profile=newProfile();migrateLegacy(profile);return {active:profile.id,profiles:[profile]};}

function homePage(){const p=me(),items=selectedItems(),s=progressStats(items),learned=items.filter(x=>x.type==='theory'&&me().known[x.id]).length;return `<section class="section-head"><div><h2>Hvad skal vi træne i dag?</h2><p class="lead">Du træner lige nu mod <strong>${gradeLabel(p.kup)}</strong>. Vælg en anden grad, eller sammensæt dit eget pensum.</p></div></section><div class="grid"><div class="panel"><div class="metric">${s.done}/${s.skills}</div><p class="strong">Teknikker & former</p><div class="progress"><span style="width:${pct(s.done,s.skills)}%"></span></div><p class="metric-sub">${pct(s.done,s.skills)}% markeret som 숙달 · Sukdal (beherskes)</p></div><div class="panel"><div class="metric">${learned}/${s.theory}</div><p class="strong">Teori i planen</p><p class="metric-sub">Træn de koreanske ord med flashcards og quiz.</p></div><div class="panel"><div class="metric">${s.forms}</div><p class="strong">Poomse & hyung</p><p class="metric-sub">Kukkiwon og godkendt WTSDF-materiale.</p></div></div><div class="panel"><div class="rowbetween"><h3>Vælg den kup, du træner til</h3>${pill('10. → 1. kup')}</div>${gradePicker()}</div><div class="grid two"><div class="panel"><h3>🎯 Træn dit kup</h3><p class="muted">Teknikker, teori, former og praktiske krav for ${p.kup}. kup.</p><button class="btn" data-mode="grade">Åbn gradens træning</button></div><div class="panel"><h3>🧩 Byg din egen træning</h3><p class="muted">Mix eksempelvis 6. kup med Taegeuk 1–3, eller vælg kun de teknikker, du vil fokusere på.</p><div class="actionrow"><button class="btn secondary" data-example-plan>Lav eksempelplan</button><button class="btn ghost" data-page="builder">Tilpas selv</button></div></div></div><div class="panel compact"><div class="rowbetween"><div><h3>Din lokale profil</h3><p class="small muted">Gemmes på denne enhed. Andre brugere kan oprette deres egen profil uden login.</p></div><button class="btn secondary small" data-page="profiles">Profiler og sikkerhedskopi</button></div></div>`;}
function curriculumPage(){const p=me();const items=gradeItems();const filt=ui.curriculumType;const selected=filt==='all'?ORDER:ORDER.filter(x=>x===filt);return `<div class="section-head"><div><h2>📚 Pensum for ${gradeLabel(p.kup)}</h2><p class="lead">Fra Arirangs kup-pensum (02.06.2024), side ${SYLLABUS[p.kup].sourcePages.join(', ')}. Brug et andet kup, hvis du vil se en anden grad.</p></div><button class="btn secondary" data-page="builder">+ Tilføj til personlig plan</button></div><div class="panel compact"><div class="selectrow"><label class="strong" for="grade-select">Træner til</label><select id="grade-select" data-select-grade>${KUPS.map(k=>`<option value="${k}" ${p.kup===k?'selected':''}>${gradeLabel(k)}</option>`).join('')}</select></div></div><div class="filterbar">${[['all','Alle'],...ORDER.map(x=>[x,TYPE_LABEL[x]])].map(([v,n])=>`<button class="btn small ${filt===v?'':'secondary'}" data-currtype="${v}">${n}</button>`).join('')}</div>${selected.map(type=>categoryGroup(items,type)).join('')}<div class="note">Dette er en digital studieoversigt med krav og navne fra klubpensummet, ikke en gengivelse af hele elevmappen. Træneren bestemmer korrekt udførelse og aktuelle gradueringskrav.</div>`;}
function builderPage(){const p=me(),added=p.extraIds.filter(id=>IDX[id]),core=p.includeGrade?SYLLABUS[p.kup].items.length:0,filter=ALL.filter(i=>(ui.planCategory==='all'||i.type===ui.planCategory)&&(ui.planGrade==='all'||String(i.kup)===ui.planGrade)&&(i.name+' '+i.desc).toLowerCase().includes(ui.planSearch.toLowerCase())).sort((a,b)=>b.kup-a.kup||ORDER.indexOf(a.type)-ORDER.indexOf(b.type));return `<div class="section-head"><div><h2>🧩 Byg din egen træning</h2><p class="lead">Vælg en målgrad og tilføj præcis det, du vil øve – fra enhver kup. Dine valg gemmes i profilen.</p></div><button class="btn" data-mode="custom">Brug min plan (${new Set([...p.includeGrade?SYLLABUS[p.kup].items.map(x=>x.id):[],...p.extraIds]).size})</button></div><div class="grid two"><div class="panel"><h3>1 · Målgrad</h3><div class="selectrow"><select data-select-grade>${KUPS.map(k=>`<option value="${k}" ${p.kup===k?'selected':''}>${gradeLabel(k)}</option>`).join('')}</select></div><label class="checkbox-row" style="margin-top:14px"><input type="checkbox" data-include-base ${p.includeGrade?'checked':''}><span>Medtag hele pensummet for denne kup</span></label><p class="small muted">${core} punkter fra ${p.kup}. kup er inkluderet automatisk.</p></div><div class="panel"><h3>2 · Vælg ekstra emner</h3><p class="muted">Eksempel: 6. kup + Taegeuk 1–3</p><div class="actionrow"><button class="btn secondary" data-example-plan>Tilføj præcis dette eksempel</button><button class="btn ghost" data-clear-extras>Ryd ekstravalg</button></div><div>${pill(added.length+' håndplukkede punkter','ok')}</div></div></div><div class="panel"><h3>3 · Find det, du vil øve</h3><div class="filterbar"><select data-plan-type><option value="all" ${ui.planCategory==='all'?'selected':''}>Alle kategorier</option>${ORDER.map(x=>`<option value="${x}" ${ui.planCategory===x?'selected':''}>${TYPE_LABEL[x]}</option>`).join('')}</select><select data-plan-grade><option value="all">Alle grader</option>${KUPS.map(k=>`<option value="${k}" ${ui.planGrade===String(k)?'selected':''}>${gradeLabel(k)}</option>`).join('')}</select><input type="search" value="${cleanText(ui.planSearch)}" data-plan-search placeholder="Søg fx Taegeuk, spark eller blokering..." aria-label="Søg i hele pensummet"><button class="btn small secondary" data-search-plan>Søg</button></div><p class="small muted">${filter.length} resultater · marker de enkelte elementer du vil have med. Punkter fra målgraden kan også bruges, selvom du fjerner hele målgraden.</p><div>${filter.slice(0,100).map(i=>`<div class="listed"><div><strong>${cleanText(i.name)}</strong><small>${i.kup}. kup · ${TYPE_LABEL[i.type]} · ${cleanText(i.desc).slice(0,115)}</small></div><label class="checkbox-row"><input type="checkbox" data-add-id="${i.id}" ${p.extraIds.includes(i.id)?'checked':''}><span class="small">Medtag</span></label></div>`).join('')}</div>${filter.length>100?'<p class="small muted">Viser de første 100; brug filtre eller søgning for resten.</p>':''}</div><div class="panel"><div class="rowbetween"><div><h3>4 · Træn din plan</h3><p class="small muted">${p.mode==='custom'?'Din personlige plan er aktiv.':'Du bruger stadig kun målgraden; aktivér din plan med knappen.'}</p></div><button class="btn" data-mode="custom">Aktivér og træn →</button></div></div>`;}
function trainingPage(){const items=selectedItems();const type=ui.trainingType;const show=type==='all'?items:items.filter(x=>x.type===type);const s=progressStats(items);return `<div class="section-head"><div><h2>🥋 Mit træningspas</h2><p class="lead">${me().mode==='custom'?'Personlig træning, sammensat på tværs af kup.':'Alle punkter fra '+gradeLabel(me().kup)+'.'} ${qty(items.length,'punkt','punkter')} i alt.</p></div><button class="btn secondary" data-page="builder">Redigér min plan</button></div><div class="panel compact"><div class="rowbetween"><span class="strong">${s.done} af ${s.skills} teknikker og former beherskes</span><span class="muted small">${pct(s.done,s.skills)}%</span></div><div class="progress"><span style="width:${pct(s.done,s.skills)}%"></span></div></div><div class="filterbar">${[['all','Alle'],...ORDER.map(x=>[x,TYPE_LABEL[x]])].map(([v,n])=>`<button class="btn small ${type===v?'':'secondary'}" data-train-type="${v}">${n}</button>`).join('')}</div>${show.length?`<div class="panel">${show.map(i=>`<div class="rowbetween small muted" style="margin-top:12px">${TYPE_ICON[i.type]} ${TYPE_LABEL[i.type]}</div>${itemHTML(i)}`).join('')}</div>`:'<div class="empty">Ingen punkter i dette område. Tilføj dem i din personlige plan.</div>'}`;}
function quizSource(){return selectedItems().filter(isQuizWord);}

function startQuiz(mode='standard'){
  cancelSpeech();
  const listen=mode==='listening';
  const candidates=shuffle(quizSource().filter(x=>!listen||playableTheory(x)));
  const pool=ALL.filter(isQuizWord);
  if(!candidates.length){ui.quiz=null;render();return;}
  ui.quiz={
    mode,
    questions:candidates.slice(0,Math.min(12,candidates.length)).map(x=>{
      const unique=shuffle(pool.filter(y=>y.id!==x.id&&y.desc!==x.desc&&y.name!==x.name));
      return {id:x.id,q:x.name,correct:x.desc,choices:shuffle([
        x.desc,...[...new Map(unique.map(y=>[y.desc,y])).values()].slice(0,3).map(y=>y.desc)
      ])};
    }),index:0,selected:-1,score:0
  };
  render();
  // Manual play is more reliable across Firefox and mobile browsers.
}
function quizPage(){
  const theory=quizSource();
  if(!theory.length)return `<div class="panel"><h2>🧠 Teoritræning</h2><p>Din aktive træning indeholder ingen teoriord. Vælg 6. kup eller tilføj teori til din personlige plan.</p><button class="btn" data-page="builder">Tilføj teori</button></div>`;
  const listenable=theory.filter(playableTheory);
  const note=`<div class="note soft">Oplæsningen bruger enhedens indbyggede stemmer. Kendte koreanske ord læses med koreansk TTS, når stemmen er installeret; ellers bruges Arirangs danske udtalehjælp. Udtalen er vejledende og skal kontrolleres med instruktøren. Ingen lydfiler eller server nødvendig.</div>`;
  if(ui.quiz){
    const z=ui.quiz;
    if(z.index>=z.questions.length)return `<div class="panel"><h2>🏆 ${z.score}/${z.questions.length} korrekte!</h2><p>${z.score===z.questions.length?'Flot – alle rigtige! 🌟':'God træning! Prøv igen, og øv de svære ord lidt ekstra.'}</p><button class="btn" data-start-quiz="${z.mode}">Prøv igen</button><button class="btn secondary" data-exit-quiz>Tilbage til flashcards</button></div>`;
    const q=z.questions[z.index], listening=z.mode==='listening';
    return `<div class="panel"><div class="rowbetween"><h2>${listening?'🎧 Lyttequiz':'Teoriprøve'} · ${z.index+1}/${z.questions.length}</h2>${pill(z.score+' rigtige','ok')}</div>
      ${listening?`<h3>Hvilken betydning hører du?</h3><p class="muted small">Tryk på Afspil ordet. Svarmulighederne låses op, når oplæsningen starter.</p><div class="tts-actions"><button class="btn" data-speak-item="${q.id}" data-speak-type="ko">🔊 Afspil ordet</button><button class="btn secondary" data-switch-text-quiz>Skift til tekstquiz</button></div>`:
      `<h3>Hvad betyder ${cleanText(q.q)}?</h3>${ttsButtons(IDX[q.id])}`}
      ${q.choices.map((ans,n)=>`<button class="quiz-choice ${z.selected>=0&&ans===q.correct?'good':''} ${z.selected===n&&ans!==q.correct?'bad':''}" data-quiz-choice="${n}" ${z.selected>=0||(listening&&!z.heard)?'disabled':''}>${cleanText(ans)}</button>`).join('')}
      ${z.selected>=0?`<p><strong>${listening?'Ordet':'Rigtigt svar'}:</strong> ${listening?cleanText(q.q)+' – ':''}${cleanText(q.correct)}</p><button class="btn" data-quiz-next>${z.index===z.questions.length-1?'Se resultat':'Næste →'}</button>`:''}
      ${ttsSettings()}${note}</div>`;
  }
  const curr=theory[ui.flashIndex%theory.length];
  return `<div class="section-head"><div><h2>🧠 Flashcards, lyttequiz & teoriprøve</h2><p class="lead">Kortene kommer fra teorien i din aktive træning (${theory.length} punkter).</p></div><div class="actionrow"><button class="btn secondary" data-start-quiz="standard">Start teoriprøve (${Math.min(theory.length,12)} spørgsmål)</button><button class="btn" data-start-quiz="listening" ${!TTS_AVAILABLE||!listenable.length?'disabled':''}>🎧 Start lyttequiz (${Math.min(listenable.length,12)} ord)</button></div></div>
    <div class="panel"><div class="flash"><div class="muted small">Kort ${(ui.flashIndex%theory.length)+1}/${theory.length} · ${curr.kup}. kup</div><h2>${cleanText(curr.name)}</h2>${ttsButtons(curr,{meaning:ui.flashFlipped})}${ui.flashFlipped?`<div class="answer">${cleanText(curr.desc)}</div><p class="muted">${curr.pron?'['+cleanText(curr.pron)+']':''}</p>`:'<p class="muted">Hvad betyder det på dansk?</p>'}</div>
    <div class="actionrow">${ui.flashFlipped?`<button class="btn secondary" data-flash-known="0">Øv igen</button><button class="btn" data-flash-known="1">Det kunne jeg ✓</button>`:`<button class="btn" data-flash-flip>Vis svaret</button>`}<button class="btn ghost" data-flash-next>Næste →</button></div>${ttsSettings()}${note}</div>`;
}
function videosPage(){const available=ui.videoFilter==='all'?ALL.filter(i=>i.video):selectedItems().filter(i=>i.video||me().videos[i.id]);const uniq=new Map(available.map(i=>[i.id,i]));return `<div class="section-head"><div><h2>🎬 Videoer fra godkendte kilder</h2><p class="lead">Kukkiwon og Western Tang Soo Do Federation. Stefan har bekræftet Cho Dan; øvrige WTSDF-former er referencer, hvor Arirangs udførelse kan være anderledes.</p></div><div class="actionrow"><button class="btn small ${ui.videoFilter==='plan'?'':'secondary'}" data-video-filter="plan">I min træning</button><button class="btn small ${ui.videoFilter==='all'?'':'secondary'}" data-video-filter="all">Hele biblioteket</button></div></div>${Array.from(uniq.values()).map(i=>`<div class="panel"><div class="rowbetween"><div><div class="mini-title">${TYPE_LABEL[i.type]} · ${i.kup}. kup</div><h3>${cleanText(i.name)}</h3></div>${videoBadge(videoSource(i)||i.video)}</div>${videoHTML(i)}</div>`).join('')||'<div class="empty">Ingen videoer til de valgte punkter. Vis hele biblioteket eller tilføj former til din plan.</div>'}<div class="note soft">Vi indlejrer først YouTube, når du trykker Afspil. Ved problemer kan du åbne videoen på YouTube. Ingen videoer fra Korean Cultural Centre Nigeria anvendes.</div>`;}
function profilesPage(){return `<div class="section-head"><div><h2>👤 Profiler og data</h2><p class="lead">Hver profil har sin kup, personlige træning, teori og fremskridt på denne enhed.</p></div></div><div class="grid two"><div class="panel"><h3>Nuværende profil</h3><div class="profile-form"><input id="renameInput" value="${cleanText(me().name)}" maxlength="40" aria-label="Profilnavn"><button class="btn" data-rename>Gem navn</button></div><p class="small muted">Gælder kun denne browser. Ingen konto nødvendig.</p></div><div class="panel"><h3>Opret en ekstra elev</h3><div class="profile-form"><input id="newProfileInput" placeholder="Navn eller kaldenavn" maxlength="40" aria-label="Ny elev"><button class="btn secondary" data-new-profile>Opret</button></div></div></div><div class="panel"><h3>Alle profiler</h3>${db.profiles.map(p=>`<div class="listed"><div><strong>${cleanText(p.name)} ${p.id===db.active?'✓':''}</strong><small>${gradeLabel(p.kup)} · ${p.mode==='custom'?'Personlig plan':'Kup-pensum'}</small></div><button class="btn small ${p.id===db.active?'success':'secondary'}" data-profile="${p.id}">${p.id===db.active?'Aktiv':'Vælg'}</button></div>`).join('')}</div><div class="panel"><h3>Eksportér eller importer data</h3><p>Data ligger lokalt i browseren. Eksportér en sikkerhedskopi, hvis I skifter telefon eller tablet.</p><button class="btn secondary" data-backup>↓ Download sikkerhedskopi</button><label class="btn ghost" for="backupFile">↑ Importér sikkerhedskopi</label><input type="file" id="backupFile" data-import accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"><p class="small muted">En import erstatter alle lokale profiler og deres fremskridt.</p></div><div class="note">Hvis I vil have elevernes fremskridt synkroniseret på tværs af enheder, kræver det et senere login og en backend. Denne version har bevidst ingen server eller registrering.</div>`;}
function render(){hero();menu();const views={home:homePage,curriculum:curriculumPage,builder:builderPage,training:trainingPage,quiz:quizPage,videos:videosPage,profiles:profilesPage,...(window.arirangPracticePages||{})};document.getElementById('app').innerHTML=(views[page]||homePage)();}
function parseYoutube(raw){try{const u=new URL(String(raw).trim());let id=null;if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1];}else if(['youtu.be','www.youtu.be'].includes(u.hostname)){id=u.pathname.slice(1).split('/')[0];}return /^[\w-]{11}$/.test(id||'')?id:null;}catch{return null;}}
function applyExample(){const p=me();p.kup=6;p.includeGrade=true;p.extraIds=[9,8,7].map(k=>IDX[`k${k}-forms-0`]?.id).filter(Boolean);p.mode='custom';save();navigate('builder');}
function clickHandler(e){const b=e.target.closest('button');if(!b)return;const d=b.dataset,p=me();
 if(d.testTts!==undefined){speakItem({name:'Lydtest',desc:'Dette er en test af dansk oplæsning.'},'da');return;}
 if(d.speakItem){speakItem(IDX[d.speakItem],d.speakType||'ko');return;}
 if(d.stopTts!==undefined){cancelSpeech();return;}
 if(d.page){navigate(d.page);return;}
 if(d.setGrade){activateGrade(Number(d.setGrade));return;}
 if(d.mode){p.mode=d.mode;save();navigate('training');return;}
 if(d.examplePlan!==undefined){applyExample();return;}
 if(d.clearExtras!==undefined){p.extraIds=[];save();render();return;}
 if(d.currtype){ui.curriculumType=d.currtype;render();return;}
 if(d.trainType){ui.trainingType=d.trainType;render();return;}
 if(d.videoFilter){ui.videoFilter=d.videoFilter;ui.openVideo=null;render();return;}
 if(d.searchPlan!==undefined){ui.planSearch=document.querySelector('[data-plan-search]')?.value||'';render();return;}
 if(d.mastery){const [id,score]=d.mastery.split(':');p.mastery[id]=Number(score);save();render();return;}
 if(d.known){p.known[d.known]=!p.known[d.known];save();render();return;}
 if(d.toggleVideo){ui.openVideo=ui.openVideo===d.toggleVideo?null:d.toggleVideo;render();return;}
 if(d.saveVideo){const id=parseYoutube(document.querySelector(`[data-video-input="${d.saveVideo}"]`)?.value||'');if(!id){alert('Indsæt et gyldigt YouTube-link.');return;}p.videos[d.saveVideo]=id;save();render();return;}
 if(d.deleteVideo){delete p.videos[d.deleteVideo];save();render();return;}
 if(d.flashFlip!==undefined){ui.flashFlipped=true;render();return;}
 if(d.flashNext!==undefined){cancelSpeech();ui.flashIndex++;ui.flashFlipped=false;render();return;}
 if(d.flashKnown!==undefined){cancelSpeech();const words=quizSource();const x=words[ui.flashIndex%words.length];if(x)p.known[x.id]=d.flashKnown==='1';ui.flashIndex++;ui.flashFlipped=false;save();render();return;}
 if(d.startQuiz!==undefined){startQuiz(d.startQuiz||'standard');return;}
 if(d.exitQuiz!==undefined){cancelSpeech();ui.quiz=null;render();return;}
 if(d.quizChoice!==undefined&&ui.quiz&&ui.quiz.selected<0){const z=ui.quiz,q=z.questions[z.index];z.selected=Number(d.quizChoice);if(q.choices[z.selected]===q.correct)z.score++;render();return;}
 if(d.quizNext!==undefined&&ui.quiz){cancelSpeech();ui.quiz.index++;ui.quiz.selected=-1;ui.quiz.heard=false;render();return;}
 if(d.newProfile!==undefined){const input=document.getElementById('newProfileInput');const name=input?.value.trim();if(!name){alert('Skriv et navn eller kaldenavn.');return;}const q=newProfile(name.slice(0,40));db.profiles.push(q);db.active=q.id;save();navigate('home');return;}
 if(d.rename!==undefined){const name=document.getElementById('renameInput')?.value.trim();if(!name)return;p.name=name.slice(0,40);save();render();return;}
 if(d.profile){db.active=d.profile;save();navigate('home');return;}
 if(d.backup!==undefined){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='arirang-traening-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
}
async function changeHandler(e){const x=e.target,p=me();
 if(x.matches('[data-tts-rate]')){speechRate=Number(x.value);try{localStorage.setItem('arirang-tts-rate-v1',String(speechRate));}catch{}return;}
 if(x.matches('[data-select-grade]')){p.kup=Number(x.value);save();render();return;}
 if(x.matches('[data-include-base]')){p.includeGrade=x.checked;save();render();return;}
 if(x.matches('[data-plan-type]')){ui.planCategory=x.value;render();return;}
 if(x.matches('[data-plan-grade]')){ui.planGrade=x.value;render();return;}
 if(x.matches('[data-plan-search]')){ui.planSearch=x.value;render();return;}
 if(x.matches('[data-add-id]')){const id=x.dataset.addId;if(x.checked&&!p.extraIds.includes(id))p.extraIds.push(id);if(!x.checked)p.extraIds=p.extraIds.filter(y=>y!==id);save();render();return;}
 if(x.matches('[data-check]')){p.checks[x.dataset.check]=x.checked;save();render();return;}
 if(x.matches('#profileSelect')){db.active=x.value;save();navigate('home');return;}
 if(x.matches('[data-import]')){const file=x.files?.[0];if(!file)return;try{const val=JSON.parse(await file.text());if(!Array.isArray(val.profiles)||!val.profiles.length||val.profiles.length>100)throw Error('invalid');if(!confirm('Erstatte alle lokale profiler og fremskridt med filens indhold?'))return;db={profiles:val.profiles.map(normalizeProfile),active:val.active};if(!db.profiles.some(q=>q.id===db.active))db.active=db.profiles[0].id;save();navigate('home');}catch{alert('Filen er ikke en gyldig sikkerhedskopi af Arirang Træningsportal.');}return;}
}
document.addEventListener('click',clickHandler);
document.addEventListener('change',changeHandler);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSpeech();});
render();
</script><script src="./video-catalog.js" defer></script><script src="./voice-picker.js" defer></script><script src="./tts-reliability.js" defer></script><script src="./data-guard.js" defer></script><script src="./progress-tools.js" defer></script><script src="./training-tools.js" defer></script><script src="./daily-training.js" defer></script><script>document.addEventListener("DOMContentLoaded",()=>{render();});</script></body></html>
